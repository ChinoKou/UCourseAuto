[project]
name = "ucourseauto"
version = "1.2.0"
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "py-machineid>=1.0.0",
    "pycryptodome>=4.1.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.2", "ty>=0.0.91"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ty.environment]
python-version = "3.15"

[tool.ty.rules]
possibly-unresolved-reference = "error"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ty.src]
include = ["main.py", "src", "tests"]
exclude = ["build"]
